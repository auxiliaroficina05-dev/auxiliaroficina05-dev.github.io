<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina</title>
<style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#eef0f3;color:#4b5563;display:grid;place-items:center;min-height:100vh;text-align:center;font-size:18px}
.bola{width:46px;height:46px;border:5px solid #d1d5db;border-top-color:#f5a524;border-radius:50%;margin:0 auto 14px;animation:g 1s linear infinite}@keyframes g{to{transform:rotate(360deg)}}a{color:#2563eb}</style>
</head><body><div id="m"><div class="bola"></div>Carregando…</div>
<script>
/* ======================================================================
   OFICINA DIGITAL – site
   A ÚNICA linha para mexer é a de baixo: entre as aspas fica o
   "URL do app da Web" do Apps Script (o que termina em /exec).
   ====================================================================== */
var API = 'https://script.google.com/macros/s/AKfycbxXZVxV__9Swv5FfiU01igtWzmQHozHavT6Ji6SOwX_3Y-rNljjA5mhlZQqSQdyYsPy/exec';

var SITE = location.origin + location.pathname;
var Q = location.search.replace(/^\?/, '');
function abrir(n) {
  fetch(API + '?api=page&site=' + encodeURIComponent(SITE) + (Q ? '&' + Q : ''))
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (h) { document.open(); document.write(h); document.close(); })
    .catch(function () {
      if (n < 2) return setTimeout(function () { abrir(n + 1); }, 1500);
      document.getElementById('m').innerHTML = 'Sem conexão com o sistema.<br><br><a href="">Tentar de novo</a>';
    });
}
abrir(0);
</script>
</body></html>
